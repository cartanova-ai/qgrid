name: Build and Publish

on:
  push:
    branches: [main]

permissions:
  id-token: write # Required for npm trusted publisher (OIDC)
  contents: read
  packages: write # Publish the release container to GHCR.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: deployment

    # 패키지된 CLI 를 빈 DB 에 실제로 부팅해 migration 전체가 dist 산출물로 실행되는지 검증한다.
    # 2.9.0 은 pending migration 을 .ts 로 import 하다 부팅에 실패했는데, import 만 하는 스모크로는 잡히지 않았다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install_args: --locked

      - name: Configure npm registry authentication
        shell: bash
        run: |
          NPMRC="$RUNNER_TEMP/.npmrc"
          {
            printf '%s\n' "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}"
            printf '%s\n' 'registry=https://registry.npmjs.org/'
            printf '%s\n' 'always-auth=false'
          } > "$NPMRC"
          printf '%s\n' "NPM_CONFIG_USERCONFIG=$NPMRC" >> "$GITHUB_ENV"
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            printf '%s\n' 'NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX' >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: mise exec -- pnpm install

      - name: Check
        run: mise run check

      - name: Test API units, SDK, and CLI packaging contract
        run: mise run test

      - name: Build
        run: mise run build

      - name: Smoke test published CLI runtime
        run: |
          PACK_DIR="$(mktemp -d)"
          INSTALL_DIR="$(mktemp -d)"
          NODE_BIN="$(mise exec -- node -e 'process.stdout.write(process.execPath)')"
          mise exec -- pnpm --dir packages/cli pack --pack-destination "$PACK_DIR"
          cp "$PACK_DIR"/cartanova-qgrid-cli-*.tgz "$GITHUB_WORKSPACE/deploy/docker/qgrid-cli.tgz"
          mise exec -- npm install --prefix "$INSTALL_DIR" --ignore-scripts "$PACK_DIR"/cartanova-qgrid-cli-*.tgz
          cd "$INSTALL_DIR/node_modules/@cartanova/qgrid-cli"
          "$NODE_BIN" --input-type=module -e "await import('sonamu')"
          printf '%s\n' "QGRID_SMOKE_INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"

      - name: Boot published CLI against an empty database
        run: |
          NODE_BIN="$(mise exec -- node -e 'process.stdout.write(process.execPath)')"
          DB_URL="postgres://postgres:postgres@localhost:5432/postgres"
          BOOT_LOG="$RUNNER_TEMP/qgrid-boot.log"
          cd "$QGRID_SMOKE_INSTALL_DIR/node_modules/@cartanova/qgrid-cli"
          "$NODE_BIN" dist/cli.js --skip-update --db "$DB_URL" --port 44990 > "$BOOT_LOG" 2>&1 &
          QGRID_PID=$!
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:44990/api/qgrid/health > /dev/null; then break; fi
            if ! kill -0 "$QGRID_PID" 2> /dev/null; then
              echo "qgrid exited before listening"; cat "$BOOT_LOG"; exit 1
            fi
            sleep 2
          done
          curl -sf http://localhost:44990/api/qgrid/health || { cat "$BOOT_LOG"; exit 1; }
          EXPECTED="$(ls "$GITHUB_WORKSPACE"/packages/api/src/migrations/*.ts | wc -l | tr -d ' ')"
          APPLIED="$("$NODE_BIN" --input-type=module -e "
            import pg from 'pg';
            const c = new pg.Client({ connectionString: process.argv[1] });
            await c.connect();
            const r = await c.query('select count(*)::int as n from knex_migrations');
            await c.end();
            process.stdout.write(String(r.rows[0].n));
          " "$DB_URL")"
          echo "migrations applied=$APPLIED expected=$EXPECTED"
          kill "$QGRID_PID" || true
          grep -q 'migration: ' "$BOOT_LOG" || { echo "boot log has no migration line"; cat "$BOOT_LOG"; exit 1; }
          test "$APPLIED" = "$EXPECTED" || { cat "$BOOT_LOG"; exit 1; }

      # npm publish (버전 안 바뀌면 스킵)
      - name: Publish packages
        run: mise run publish:packages
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="$(jq -r .version packages/cli/package.json)"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PACKAGE="${GITHUB_REPOSITORY#*/}"
          if gh api --paginate --slurp "/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$PACKAGE/versions?per_page=100" \
            > "$RUNNER_TEMP/image-versions.json" 2> "$RUNNER_TEMP/image-inspect.log"; then
            EXISTS="$(jq --arg version "$VERSION" 'any(.[][]; .metadata.container.tags | index($version) != null)' "$RUNNER_TEMP/image-versions.json")"
            echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/image-inspect.log"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/image-inspect.log"
            exit 1
          fi

      - name: Build release image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: deploy/docker
          load: true
          tags: ${{ steps.image.outputs.name }}
          build-args: QGRID_VERSION=${{ steps.image.outputs.version }}

      - name: Smoke test release image
        if: steps.image.outputs.exists == 'false'
        env:
          QGRID_RELEASE_IMAGE: ${{ steps.image.outputs.name }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          docker run --rm --entrypoint claude "$QGRID_RELEASE_IMAGE" --version
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres qgrid_docker_smoke
          docker run -d --name qgrid-image-smoke --network host \
            -e QGRID_DB_HOST=127.0.0.1 -e QGRID_DB_PORT=5432 \
            -e QGRID_DB_USER=postgres -e QGRID_DB_PASSWORD=postgres \
            -e QGRID_DB_NAME=qgrid_docker_smoke -e PORT=44991 \
            "$QGRID_RELEASE_IMAGE"
          trap 'docker logs qgrid-image-smoke; docker rm -f qgrid-image-smoke' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:44991/api/qgrid/health; then break; fi
            test "$(docker inspect -f '{{.State.Running}}' qgrid-image-smoke)" = true || exit 1
            sleep 2
          done
          curl -fsS http://127.0.0.1:44991/api/qgrid/health
          APPLIED="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d qgrid_docker_smoke -Atc 'select count(*) from knex_migrations')"
          EXPECTED="$(docker exec qgrid-image-smoke sh -c 'ls src/migrations/*.ts | wc -l')"
          test "$APPLIED" = "$EXPECTED"

      - name: Publish release image
        if: steps.image.outputs.exists == 'false'
        env:
          QGRID_RELEASE_IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "$QGRID_RELEASE_IMAGE"
