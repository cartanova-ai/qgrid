  # qgrid-only entries, not in the Sonamu catalog. Keep each on the Sonamu cohort above.
  # packages/cli pins Better Auth's core to the same release as better-auth.
  "@better-auth/core": ~1.7.11

# Same named catalogs as Sonamu 0.13.0. ts-node-compat provides a TypeScript with the JS
# compiler API, which declaration emit needs; the default catalog's TypeScript 7 lacks it.
catalogs:
  ts-node-compat:
    typescript: npm:@typescript/typescript6@6.0.2

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  bcrypt: true
  esbuild: true
  libpq: true
  msw: false
  sharp: true
  sodium-native: true
  unrs-resolver: true

overrides:
  axios@<0.30.0: ">=0.30.0"
  axios@<0.30.2: ">=0.30.2"
  axios@>=0.8.1 <0.28.0: ">=0.28.0"
  mdast-util-to-hast@>=13.0.0 <13.2.1: ">=13.2.1"
  prismjs@<1.30.0: ">=1.30.0"
  # Sonamu 0.13.0 upgrade guide: seroval below 1.6.11 has a deserialization vulnerability.
  seroval: ^1.6.11
  seroval-plugins: 1.5.6

minimumReleaseAgeExclude:
  - sonamu@0.13.6
  - "@sonamu-kit/cli@0.3.0"
  - "@sonamu-kit/react-components@0.5.1"
  - "@sonamu-kit/hmr-runner@0.3.0"

# Upstream peer ranges lag the versions their own parents install; remove each once upstream widens it.
peerDependencyRules:
  allowedVersions:
    # sonamu/cache statically imports bentocache's redis driver, so ioredis must be installed even
    # with memory-only caching. bentocache and @boringnode/bus still declare ioredis ^5; sonamu
    # 0.13 requires ioredis 6, and Sonamu's upgrade guide states its cache adapters work on it.
    bentocache>ioredis: ^6.0.0
    "@boringnode/bus>ioredis": ^6.0.0
    # bentocache still declares kysely ^0.27; better-auth 1.7 installs 0.29.
    bentocache>kysely: ^0.29.0
    # tsdown's dts plugin accepts TypeScript ~7.0; sonamu 0.13 requires the 7.1 dev build.
    rolldown-plugin-dts>typescript: 7.1.0-dev.20260831.1
